<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Journal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f4f0;
      color: #1a1a18;
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      width: 200px;
      min-width: 200px;
      background: #fff;
      border-right: 1px solid #e8e6e0;
      display: flex;
      flex-direction: column;
      padding: 20px 12px;
      gap: 4px;
    }

    #sidebar h2 {
      font-size: 13px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      padding: 0 6px;
    }

    .entry-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: #444;
      transition: background 0.1s;
    }
    .entry-link:hover { background: #f5f4f0; }
    .entry-link.active { background: #f0f7f4; color: #0f6e56; font-weight: 500; }

    .mood-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-stats {
      margin-top: auto;
      padding: 12px 8px;
      border-top: 1px solid #e8e6e0;
    }
    .stats-label { font-size: 11px; color: #999; margin-bottom: 4px; }
    .stats-value { font-size: 22px; font-weight: 600; color: #1a1a18; }
    .stats-value span { font-size: 12px; font-weight: 400; color: #999; }

    /* ── New session btn ── */
    #new-session-btn {
      width: 100%;
      padding: 8px;
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      margin-bottom: 12px;
      transition: background 0.15s;
    }
    #new-session-btn:hover { background: #0f6e56; }

    /* ── Main area ── */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat-header {
      background: #fff;
      border-bottom: 1px solid #e8e6e0;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    #chat-title { font-size: 15px; font-weight: 500; }

    .mood-badge {
      font-size: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      background: #e1f5ee;
      color: #0f6e56;
      font-weight: 500;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .bubble {
      max-width: 70%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
    }
    .bubble.claude {
      background: #fff;
      border: 1px solid #e8e6e0;
      align-self: flex-start;
      border-radius: 4px 14px 14px 14px;
      color: #1a1a18;
    }
    .bubble.user {
      background: #1D9E75;
      color: #e1f5ee;
      align-self: flex-end;
      border-radius: 14px 4px 14px 14px;
    }

    /* ── Mood picker overlay ── */
    #mood-overlay {
      position: absolute;
      inset: 0;
      background: rgba(245,244,240,0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #mood-overlay.hidden { display: none; }

    .mood-card {
      background: #fff;
      border: 1px solid #e8e6e0;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      max-width: 360px;
      width: 90%;
    }
    .mood-card h3 { font-size: 18px; font-weight: 500; margin-bottom: 6px; }
    .mood-card p { font-size: 13px; color: #888; margin-bottom: 24px; }

    .mood-options {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .mood-btn {
      width: 48px; height: 48px;
      border-radius: 50%;
      border: 1.5px solid #e8e6e0;
      background: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      color: #444;
      transition: all 0.15s;
    }
    .mood-btn:hover { border-color: #1D9E75; color: #1D9E75; }
    .mood-btn.selected { background: #1D9E75; color: white; border-color: #1D9E75; }

    .mood-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #999;
      margin-bottom: 24px;
    }

    #start-btn {
      width: 100%;
      padding: 10px;
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    #start-btn:hover { background: #0f6e56; }
    #start-btn:disabled { background: #ccc; cursor: default; }

    /* ── Input bar ── */
    #input-bar {
      border-top: 1px solid #e8e6e0;
      padding: 12px 16px;
      background: #fff;
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    #user-input {
      flex: 1;
      resize: none;
      border: 1px solid #e8e6e0;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      background: #fafaf8;
      line-height: 1.4;
      max-height: 120px;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #1D9E75; }

    #send-btn {
      padding: 9px 18px;
      background: #1D9E75;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
      height: 38px;
    }
    #send-btn:hover { background: #0f6e56; }
    #send-btn:disabled { background: #ccc; cursor: default; }

    #save-btn {
      padding: 9px 14px;
      background: transparent;
      color: #888;
      border: 1px solid #e8e6e0;
      border-radius: 10px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.15s;
      height: 38px;
    }
    #save-btn:hover { border-color: #1D9E75; color: #1D9E75; }
    #save-btn.hidden { display: none; }

    /* ── Empty state ── */
    #empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 8px;
      color: #aaa;
    }
    #empty-state p { font-size: 14px; }
    #empty-state.hidden { display: none; }

    /* ── Typing indicator ── */
    .typing {
      display: flex; gap: 4px; align-items: center;
      padding: 12px 16px;
      background: #fff;
      border: 1px solid #e8e6e0;
      border-radius: 4px 14px 14px 14px;
      align-self: flex-start;
      width: 52px;
    }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: #ccc;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }
  </style>
</head>
<body>

<!-- Sidebar -->
<div id="sidebar">
  <button id="new-session-btn" onclick="showMoodPicker()">+ New session</button>
  <h2>Past entries</h2>

  {% for entry in entries %}
  <div class="entry-link" onclick="loadEntry('{{ entry.date }}')">
    <div class="mood-dot" style="background: {{ moodColor(entry.mood) }};"></div>
    {{ entry.date }}
  </div>
  {% endfor %}

  {% if avg_mood %}
  <div class="sidebar-stats">
    <div class="stats-label">Avg mood (7 days)</div>
    <div class="stats-value">{{ avg_mood }} <span>/ 5</span></div>
  </div>
  {% endif %}
</div>

<!-- Main -->
<div id="main" style="position: relative;">

  <!-- Mood overlay -->
  <div id="mood-overlay">
    <div class="mood-card">
      <h3>How are you feeling?</h3>
      <p>Rate your mood to start today's session</p>
      <div class="mood-options">
        <button class="mood-btn" onclick="selectMood(1)">1</button>
        <button class="mood-btn" onclick="selectMood(2)">2</button>
        <button class="mood-btn" onclick="selectMood(3)">3</button>
        <button class="mood-btn" onclick="selectMood(4)">4</button>
        <button class="mood-btn" onclick="selectMood(5)">5</button>
      </div>
      <div class="mood-labels"><span>rough</span><span>great</span></div>
      <button id="start-btn" disabled onclick="startSession()">Start journaling</button>
    </div>
  </div>

  <!-- Chat header -->
  <div id="chat-header">
    <div id="chat-title">New session</div>
    <div id="mood-badge" class="mood-badge" style="display:none;"></div>
  </div>

  <!-- Messages -->
  <div id="messages">
    <div id="empty-state">
      <p>Select a past entry or start a new session</p>
    </div>
  </div>

  <!-- Input bar -->
  <div id="input-bar">
    <textarea id="user-input" rows="1" placeholder="Write something..." disabled
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button id="save-btn" class="hidden" onclick="saveSession()">Save & end</button>
    <button id="send-btn" onclick="sendMessage()" disabled>Send</button>
  </div>

</div>

<script>
  let selectedMood = null;
  let sessionActive = false;
  const today = new Date().toISOString().slice(0, 10);

  function moodColor(mood) {
    if (!mood) return '#ccc';
    if (mood <= 2) return '#E24B4A';
    if (mood === 3) return '#EF9F27';
    return '#1D9E75';
  }

  function showMoodPicker() {
    document.getElementById('mood-overlay').classList.remove('hidden');
    selectedMood = null;
    document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
    document.getElementById('start-btn').disabled = true;
  }

  function selectMood(n) {
    selectedMood = n;
    document.querySelectorAll('.mood-btn').forEach((b, i) => {
      b.classList.toggle('selected', i + 1 === n);
    });
    document.getElementById('start-btn').disabled = false;
  }

  async function startSession() {
    document.getElementById('mood-overlay').classList.add('hidden');
    document.getElementById('messages').innerHTML = '';
    document.getElementById('empty-state') && document.getElementById('empty-state').remove();
    document.getElementById('chat-title').textContent = 'Today — ' + today;

    const badge = document.getElementById('mood-badge');
    badge.textContent = 'Mood: ' + selectedMood + ' / 5';
    badge.style.display = '';

    showTyping();
    const res = await fetch('/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mood: selectedMood }),
    });
    const data = await res.json();
    hideTyping();
    appendBubble('claude', data.reply);

    sessionActive = true;
    document.getElementById('user-input').disabled = false;
    document.getElementById('send-btn').disabled = false;
    document.getElementById('save-btn').classList.remove('hidden');
    document.getElementById('user-input').focus();
  }

  async function sendMessage() {
    const input = document.getElementById('user-input');
    const text = input.value.trim();
    if (!text || !sessionActive) return;

    appendBubble('user', text);
    input.value = '';
    input.style.height = '';
    input.disabled = true;
    document.getElementById('send-btn').disabled = true;

    showTyping();
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    hideTyping();
    appendBubble('claude', data.reply);

    input.disabled = false;
    document.getElementById('send-btn').disabled = false;
    input.focus();
  }

  async function saveSession() {
    await fetch('/save', { method: 'POST' });
    sessionActive = false;
    document.getElementById('user-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('save-btn').classList.add('hidden');
    appendBubble('claude', 'Session saved. Take care — see you next time.');
    setTimeout(() => location.reload(), 1500);
  }

  async function loadEntry(date) {
    sessionActive = false;
    document.getElementById('user-input').disabled = true;
    document.getElementById('send-btn').disabled = true;
    document.getElementById('save-btn').classList.add('hidden');

    document.querySelectorAll('.entry-link').forEach(el => {
      el.classList.toggle('active', el.textContent.trim().includes(date));
    });

    const res = await fetch('/entry/' + date);
    const data = await res.json();
    document.getElementById('chat-title').textContent = data.date;

    const badge = document.getElementById('mood-badge');
    if (data.mood) {
      badge.textContent = 'Mood: ' + data.mood + ' / 5';
      badge.style.display = '';
    } else {
      badge.style.display = 'none';
    }

    const msgs = document.getElementById('messages');
    msgs.innerHTML = '';
    data.messages.forEach(m => appendBubble(m.role, m.content));
  }

  function appendBubble(role, text) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = 'bubble ' + role;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  let typingEl = null;
  function showTyping() {
    const msgs = document.getElementById('messages');
    typingEl = document.createElement('div');
    typingEl.className = 'typing';
    typingEl.innerHTML = '<span></span><span></span><span></span>';
    msgs.appendChild(typingEl);
    msgs.scrollTop = msgs.scrollHeight;
  }
  function hideTyping() {
    if (typingEl) { typingEl.remove(); typingEl = null; }
  }

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function autoResize(el) {
    el.style.height = '';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
</script>

</body>
</html>
